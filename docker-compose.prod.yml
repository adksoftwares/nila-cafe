services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nila_cafe_db
      POSTGRES_USER: nila_user
      POSTGRES_PASSWORD: nila_secure_password
    ports:
      - "5432:5432"
    volumes:
      - nila_pg_data:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nila_user -d nila_cafe_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://nila_user:nila_secure_password@db:5432/nila_cafe_db
      JWT_SECRET: nila-super-secret-jwt-token-change-in-prod-xyz789
      CLIENT_ORIGIN: "http://localhost,http://localhost:80,http://localhost:5173"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nila_pg_data:
